@if (showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border w-[85%] max-w-none border">
		<h2 class="mb-4 text-lg font-bold">Contrato Inquilinos</h2>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
		<form [formGroup]="form">
			<div class="flex gap-4">
				<div class="border-border flex-1">
					<div class="mb-4 flex gap-2">
						<div class="form__group w-full">
							<div class="relative">
								<input type="number" id="monto" class="peer block" placeholder=" " formControlName="monto" />
								<label for="monto" class="floating-label"> Monto Total </label>
							</div>
							<app-validation [control]="f['monto']" [submitted]="submitted"></app-validation>
						</div>
					</div>
					<div class="mb-4 flex gap-2">
						<div class="form__group relative w-full">
							<textarea
								id="obs"
								class="border-border bg-background text-foreground focus:border-primary peer block w-full rounded-md border px-2 pt-4 pb-2 text-sm focus:ring-0"
								placeholder=" "
								formControlName="obs"
								rows="3">
							</textarea>
							<label
								for="obs"
								class="floating-label text-muted-foreground peer-focus:text-primary text-sm transition-all duration-200 peer-placeholder-shown:top-2 peer-placeholder-shown:text-gray-400 peer-focus:-top-2 peer-focus:text-xs">
								Observaciones
							</label>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-action">
				<button type="button" class="btn" (click)="close()">Cerrar</button>
				<button type="button" class="btn btn-primary" (click)="onPreSubmit()">Aceptar</button>
			</div>
		</form>
	</div>
	<app-confirm-dialog #confirmModal [message]="'¿Estás seguro?'" (confirm)="saveData()"></app-confirm-dialog>
</div>
}<app-alerts [type]="alertType"></app-alerts>
