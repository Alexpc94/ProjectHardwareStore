@if (showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h2 class="mb-4 text-lg font-bold">Contrato Inquilinos</h2>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
		<form [formGroup]="form" enctype="multipart/form-data">
			<div class="flex gap-2"><h3 class="text-muted-foreground text-sm">Listado de Inquilinos</h3></div>
			<div class="mb-4 flex gap-2">
				<div class="form__group relative w-full">
					<div class="bg-background mt-2 flex items-center rounded">
						<div class="tooltip tooltip-bottom" data-tip="Buscar Inquilino">
							<button
								type="button"
								class="border-border bg-background flex items-center justify-center px-2 transition"
								(click)="toggleInput()">
								<svg-icon
									src="assets/icons/heroicons/outline/magnifying-glass.svg"
									[svgClass]="'h-5 w-5 text-foreground'">
								</svg-icon>
							</button>
						</div>
						<select
							name="type"
							class="text-muted-foreground bg-background focus:border-primary flex-1 rounded-l-md p-2 text-sm focus:ring-0"
							formControlName="inquilino">
							@for (t of filteredTenants; track $index) {
							<option [value]="t.id">CI: {{ t.cedula }} - {{ t.ap }} {{ t.am }} {{ t.nombre }}</option>
							}
						</select>
					</div>

					<app-validation [control]="f['inquilino']" [submitted]="submitted"></app-validation>
				</div>
				@if(showInput){
				<div class="form__group relative w-1/3">
					<input
						type="text"
						placeholder="Filtrar..."
						class="border-border bg-background text-foreground mt-2 w-full rounded-md border px-2 py-2"
						(input)="filterTenants($any($event.target).value)" />
				</div>
				}
			</div>
			<div class="mb-4 flex gap-2">
				<div class="form__group w-full">
					<div class="relative">
						<input type="text" id="codcon" class="peer block" placeholder=" " formControlName="codcon" />
						<label for="codcon" class="floating-label"> Codigo contrato </label>
					</div>
					<app-validation [control]="f['codcon']" [submitted]="submitted"></app-validation>
				</div>
			</div>
			<div class="mb-4 flex gap-2">
				<div class="form__group relative w-full">
					<input
						type="date"
						id="fecha"
						class="peer block"
						placeholder=" "
						formControlName="fecha"
						onkeydown="return false"
						onclick="this.showPicker && this.showPicker()" />
					<label for="fecha" class="floating-label"> Fecha </label>
					<app-validation [control]="f['fecha']" [submitted]="submitted"></app-validation>
				</div>
				<div class="form__group relative w-full">
					<input
						type="date"
						id="fechaini"
						class="peer block"
						placeholder=" "
						formControlName="fechaini"
						onkeydown="return false"
						onclick="this.showPicker && this.showPicker()" />
					<label for="fechaini" class="floating-label"> Fecha Inicio</label>

					<app-validation [control]="f['fechaini']" [submitted]="submitted"></app-validation>
				</div>
				<div class="form__group relative w-full">
					<input
						type="date"
						id="fechafin"
						class="peer block"
						placeholder=" "
						formControlName="fechafin"
						onkeydown="return false"
						onclick="this.showPicker && this.showPicker()" />
					<label for="fechafin" class="floating-label"> Fecha Fin</label>
					<app-validation [control]="f['fechafin']" [submitted]="submitted"></app-validation>
				</div>
			</div>
			<div class="mb-4 flex gap-2">
				<div class="form__group relative w-full">
					<textarea
						id="obs"
						class="border-border bg-background text-foreground focus:border-primary peer block w-full rounded-md border px-2 pt-4 pb-2 text-sm focus:ring-0"
						placeholder=" "
						formControlName="obs"
						rows="3">
					</textarea>
					<label
						for="obs"
						class="floating-label text-muted-foreground peer-focus:text-primary text-sm transition-all duration-200 peer-placeholder-shown:top-2 peer-placeholder-shown:text-gray-400 peer-focus:-top-2 peer-focus:text-xs">
						Observaciones
					</label>
				</div>
			</div>
			<ul class="list bg-background rounded-box shadow-md">
				<li class="p-4 pb-2 text-xs tracking-wide opacity-60">detalles de contrato</li>
				<li class="list-row">
					<div class="text-4xl font-thin tabular-nums opacity-30">01</div>
					<div class="list-col-grow">
						<div>Dio Lupa</div>
						<div class="text-xs font-semibold uppercase opacity-60">Remaining Reason</div>
					</div>
				</li>
			</ul>
			<div class="modal-action">
				<button type="button" class="btn" (click)="close()">Cerrar</button>
				<button type="button" class="btn btn-primary" (click)="onPreSubmit()">Aceptar</button>
			</div>
		</form>
	</div>
	<app-confirm-dialog #confirmModal [message]="'¿Estás seguro?'" (confirm)="saveData()"></app-confirm-dialog>
</div>
} <app-alerts [type]="alertType"></app-alerts>
