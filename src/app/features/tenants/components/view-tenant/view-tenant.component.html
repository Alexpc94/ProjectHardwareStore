@if (selectedData && showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Detalle del Inquilino</h3>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>

		<div class="mb-4 flex gap-2">
			<figure class="md:rounded-se-lg flex flex-col items-center justify-center rounded-b-lg border-gray-200 p-2">
				<blockquote class="mx-auto mb-4 max-w-2xl text-gray-500 dark:text-gray-400 lg:mb-8">
					<figcaption class="flex items-center justify-center text-center">
						<img class="h-30 w-30 rounded-sm" [src]="getUserPhoto(selectedData.ubicacion)" alt="profile picture" />
						<div class="ms-3 space-y-0.5 text-left font-medium rtl:text-right dark:text-white">
							<div>{{ selectedData.nombre }} {{ selectedData.ap }} {{ selectedData.am }}</div>
							<div class="text-sm text-gray-500 dark:text-gray-400">
								<p>Dni: {{ selectedData.cedula }}</p>
								<p>Telefono: {{ selectedData.celular }}</p>
								<p>Direccion: {{ selectedData.direc }}</p>
								<div class="flex items-center space-x-2">
									<p>ubicacion:</p>
									@if (selectedData.ubicacion_gps?.latitude && selectedData.ubicacion_gps?.longitude) {
									<div class="tooltip" data-tip="Ubicacion Inquilino">
										<button (click)="toggleMap()">
											<svg-icon
												src="./assets/icons/usericons/location-svgrepo-com.svg"
												[svgClass]="'h-5 w-5'"></svg-icon>
										</button>
									</div>

									}
								</div>
								<p>Estado en sistema: {{ selectedData.estado ? 'Activo' : 'Inactivo' }}</p>
							</div>
						</div>
					</figcaption>
				</blockquote>
			</figure>
		</div>
	</div>
</div>
} @if(showMap) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h3 class="mb-4 text-lg font-bold">Detalles del Personal</h3>
		<button (click)="closeMap()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
		<app-open-street-map
			[latitude]="selectedData.ubicacion_gps?.latitude"
			[longitude]="selectedData.ubicacion_gps?.longitude"></app-open-street-map>
	</div>
</div>
}
