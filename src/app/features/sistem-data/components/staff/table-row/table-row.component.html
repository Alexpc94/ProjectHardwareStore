<ng-container>
	<td>
		<div class="flex items-center gap-2.5">
			<img alt="user avatar" class="h-9 w-9 shrink-0 rounded-full" [src]="getUserPhoto(user.photo)" />
			<div class="flex flex-col items-start">
				<span class="text-foreground text-sm font-semibold">
					{{ user.firstName }} {{ user.secondName }} {{ user.name }}</span
				>
				<span class="text-muted-foreground/70 text-xs font-medium">
					{{ user.email }}
				</span>
			</div>
		</div>
	</td>
	<td>{{ user.cedula }}</td>
	<td>{{ user.name }}</td>
	<td>{{ user.telephone }}</td>
	<td>
		<span
			class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
			[class]="user.status ? 'bg-green-500/10 text-green-800' : 'bg-red-500/10 text-red-800'">
			{{ user.status ? 'Activo' : 'Inactivo' }}
		</span>
	</td>
	<td>
		<div class="flex">
			<div class="tooltip" data-tip="Ver Usuario">
				<button (click)="viewUser(user.id)" class="block w-full px-2 py-1 text-left text-sm">
					<svg-icon src="./assets/icons/heroicons/outline/eye.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
				</button>
			</div>
			<div class="tooltip" [attr.data-tip]="user.status ? 'Modificar Usuario' : 'Usuario inactivo'">
				<button
					(click)="addUpdateUser(user.id)"
					class="block w-full px-2 py-1 text-left text-sm"
					[disabled]="!user.status">
					<svg-icon src="./assets/icons/usericons/add-svgrepo-com.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
				</button>
			</div>
			<div class="tooltip" [attr.data-tip]="user.status ? 'Dar de Baja' : 'Habilitar'">
				<button
					(click)="openModal(user.id, user.firstName + ' ' + user.secondName + ' ' + user.name, user.status)"
					class="block w-full px-2 py-1 text-left text-sm">
					<svg-icon
						[src]="
							user.status
								? './assets/icons/usericons/delete-2-svgrepo-com.svg'
								: './assets/icons/tablericons/repeat.svg'
						"
						[svgClass]="'h-4 w-4'">
					</svg-icon>
				</button>
			</div>
		</div>
	</td>

	<app-add-mod-staff [selectedID]="selectedID" (save)="handleSave($event)"> </app-add-mod-staff>
</ng-container>
<app-alerts [type]="alertType"></app-alerts>
<app-confirm-change-status
	#confirmDialog
	[name]="selectedUser?.name"
	[status]="selectedUser?.status"
	(confirm)="changeStatus()"></app-confirm-change-status>
