@if (selectedData && showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Detalle de la Persona</h3>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>

		<div class="mb-4 flex gap-2">
			<figure class="md:rounded-se-lg flex flex-col items-center justify-center rounded-b-lg border-gray-200 p-2">
				<blockquote class="mx-auto mb-4 max-w-2xl text-gray-500 dark:text-gray-400 lg:mb-8">
					<figcaption class="flex items-center justify-center text-center">
						<img class="h-15 w-15 rounded-full" [src]="getUserPhoto(selectedData.photo)" alt="profile picture" />
						<div class="ms-3 space-y-0.5 text-left font-medium rtl:text-right dark:text-white">
							<div>{{ selectedData.name }} {{ selectedData.firstName }} {{ selectedData.secondName }}</div>
							<div class="text-sm text-gray-500 dark:text-gray-400">
								<p>Correo: {{ selectedData.email }}</p>
								<p>Telefono: {{ selectedData.telephone }}</p>
								<p>Dni: {{ selectedData.cedula }}</p>
								<p>Fec. Nacimiento: {{ selectedData.dateBirth | date: 'dd/MM/yyyy' }}</p>
								<p>Genero: {{ selectedData.gender === 'M' ? 'Masculino' : 'Femenino' }}</p>
								<p>Usuario: {{ selectedData.usuario }}</p>
								<p>Estado en sistema: {{ selectedData.status ? 'Activo' : 'Inactivo' }}</p>
							</div>
						</div>
					</figcaption>
					<p class="my-4">Usuarios Registrados con Acceso al Sistema y cargos que tiene actualmente activos.</p>
					<div class="flex flex-wrap gap-2">
						@for (role of selectedRoleData; track $index) {
						<span class="rounded-full bg-blue-100 px-2 py-1 text-xs font-semibold text-blue-800">
							{{ role.name }}
						</span>
						}
					</div>
				</blockquote>
			</figure>
		</div>
	</div>
</div>
}
