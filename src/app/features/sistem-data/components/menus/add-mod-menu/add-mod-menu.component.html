@if (showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h3 class="mb-4 text-lg font-bold">Detalles del Menu</h3>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>

		<form [formGroup]="form" >
			
				<div class="form__group w-full">
					<div class="relative">
						<input
							type="text"
							id="name"
							class="peer block"
							placeholder=" "
							formControlName="name"
							autocomplete="given-name" />
						<label for="name" class="floating-label"> Nombre </label>
					</div>
					<app-validation [control]="f['name']" [submitted]="submitted"></app-validation>
				</div>
				<br>

				<div class="form__group w-full">
					<div class="relative">
						<input type="text" id="description" class="peer block" placeholder=" " formControlName="description" />
						<label for="description" class="floating-label"> Descripción </label>
					</div>
					<app-validation [control]="f['description']" [submitted]="submitted"></app-validation>
				</div>
				<br>
				<div class="mb-4 flex gap-2">
					<div class="form__group w-full">
						<div class="relative">
							<label
								for="type"
								class="bg-background text-muted-foreground peer-focus:text-primary scale-85 absolute origin-[0] transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1">
								Listado de Tipos
							</label>
							<select id="type" name="type" class="text-muted-foreground mt-2 rounded border px-2 pb-1 pt-3" formControlName="type_menu" [style.color]="form.get('type_menu')?.value ? 'var(--foreground)': 'var(--muted-foreground)'" >
								  <option value="" disabled hidden>
										Seleccione un tipo
								  </option>
								
								@for (str of menus; track $index) {
								<option [value]="str.type_menu">codigo {{ str.type_menu }} </option>
								}
							</select>
						</div>
					</div>
				</div>
				
				<br>
				
				<div class="mb-4 flex gap-2">
					<div class="form__group w-full">
						<div class="relative">

							<fieldset
									class="border-border focus-within:border-primary w-full rounded-md border bg-background transition-colors">

									<legend
									class="text-muted-foreground focus-within:text-primary ml-2 px-2 text-xs">
									Listado de Iconos
									</legend>

									<!-- Selector cerrado -->
									<button
									id="icono"
									type="button"
									class="text-muted-foreground flex w-full items-center justify-between bg-transparent px-3 pb-2 pt-1 text-left text-xs outline-none"
									[attr.aria-expanded]="iconDropdownOpen"
									(click)="iconDropdownOpen = !iconDropdownOpen">

									@if (selectedIcon; as selected) {
										<span class="text-foreground flex min-w-0 items-center gap-2">
										<img
											[src]="selected.icono"
											[alt]="selected.name"
											class="h-4 w-4 shrink-0 object-contain"
										/>

										<span class="truncate">
											{{ selected.name }}
										</span>
										</span>
									} @else {
										<span class="truncate">
										Seleccione un icono
										</span>
									}

									<svg
										class="text-muted-foreground ml-2 h-4 w-4 shrink-0 transition-transform duration-300"
										[class.rotate-180]="iconDropdownOpen"
										viewBox="0 0 20 20"
										fill="currentColor"
										aria-hidden="true">

										<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z"
										/>
									</svg>
									</button>
							</fieldset>

						<!-- Lista desplegable -->
						@if (iconDropdownOpen) {
							<div
							class="border-border bg-background text-foreground animate-fade-in-down absolute left-0 top-full z-50 max-h-60 w-full overflow-y-auto border px-2 py-1 text-xs shadow-md">

							@for (str of iconos; track str.icono) {
								<button
								type="button"
								class="hover:bg-primary hover:text-primary-foreground flex w-full items-center gap-2 rounded-sm px-2 py-2 text-left transition-colors duration-150"
								[class.bg-primary]="form.get('icono')?.value === str.icono"
								[class.text-primary-foreground]="form.get('icono')?.value === str.icono"
								(click)="selectIcon(str)">

								<img
									[src]="str.icono"
									[alt]="str.name"
									class="h-4 w-4 shrink-0 object-contain"
								/>

								<span class="truncate">
									{{ str.name }}
								</span>
								</button>
							}
							</div>
						}

						</div>
					</div>
				</div>

			

			<div class="modal-action">
				<button type="button" class="btn" (click)="close()">Cerrar</button>
				<button type="button" class="btn btn-primary" (click)="onPreSubmit()">Aceptar</button>
			</div>
		</form>
	</div>
	<app-confirm-dialog #confirmModal [message]="'¿Estás seguro?'" (confirm)="saveData()"></app-confirm-dialog>
</div>
}
