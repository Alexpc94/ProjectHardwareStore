<ng-container>
	<td>
		<div class="flex flex-col items-start">
			<span class="text-foreground text-sm font-semibold"> {{ bsector.codc }} </span>
		</div>
	</td>
	<td>
		<div class="flex flex-col items-start">
			<span class="text-foreground text-sm font-semibold"> {{ bsector.nombre }} </span>
		</div>
	</td>
	<td>
		<div class="flex flex-col items-start">
			<span class="text-foreground text-sm font-semibold"> {{ bsector.deta }} </span>
		</div>
	</td>
	<td>
		<span
			class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
			[class]="bsector.estado ? 'bg-green-500/10 text-green-800' : 'bg-red-500/10 text-red-800'">
			{{ bsector.estado ? 'Activo' : 'Inactivo' }}
		</span>
	</td>
	<td>
		<div class="flex">
			<div class="tooltip" data-tip="Ver detalle">
				<button (click)="selectRecursiveData()" class="block w-full px-1 py-1" [disabled]="!bsector.estado">
					<svg-icon src="./assets/icons/usericons/add-file-svgrepo-com.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
				</button>
			</div>

			<div class="tooltip" [attr.data-tip]="bsector.estado ? 'Modificar Rubro' : 'Rubro inactivo'">
				<button (click)="updateSection()" class="block w-full px-1 py-1" [disabled]="!bsector.estado">
					<svg-icon src="./assets/icons/usericons/add-svgrepo-com.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
				</button>
			</div>
			<div class="tooltip" [attr.data-tip]="bsector.estado ? 'Dar de Baja' : 'Habilitar'">
				<button (click)="openModalToUpdateStatus()" class="block w-full px-1 py-1">
					<svg-icon
						[src]="
							bsector.estado
								? './assets/icons/usericons/delete-2-svgrepo-com.svg'
								: './assets/icons/tablericons/repeat.svg'
						"
						[svgClass]="'h-5 w-5'">
					</svg-icon>
				</button>
			</div>
		</div>
	</td>
</ng-container>

<app-alerts [type]="alertType"></app-alerts>
<app-confirm-change-status
	#confirmDialog
	[name]="bsector.nombre"
	[message]="confirmDialog.message"
	(confirm)="changeStatus()"></app-confirm-change-status>
