@if (showModal) {
<div class="modal modal-open">
	<div class="modal-box bg-background border-border border">
		<h3 class="mb-4 text-lg font-bold">Detalles del Personal</h3>
		<button (click)="close()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
		<form [formGroup]="form">
			<div class="mb-4 flex gap-2">
				<div class="form__group w-full">
					<div class="relative">
						<input
							type="text"
							id="nombre"
							class="peer block"
							placeholder=" "
							formControlName="nombre"
							autocomplete="given-name" />
						<label for="nombre" class="floating-label"> Nombres </label>
					</div>
					<app-validation [control]="f['nombre']" [submitted]="submitted"></app-validation>
				</div>
			</div>
			<div class="modal-action">
				<button type="button" class="btn" (click)="close()">Cerrar</button>
				<button type="button" class="btn btn-primary" (click)="onPreSubmit()">Aceptar</button>
			</div>
		</form>
	</div>
	<app-confirm-dialog #confirmModal [message]="'¿Estás seguro?'" (confirm)="saveData()"></app-confirm-dialog>
</div>
}
